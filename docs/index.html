<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sanchi Orders</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1b2fd0">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--b:#1b2fd0;--c:#19b4ee;--bg:#f2f7fd;--ink:#101a4d;--mut:#5a6798;--ln:#d5e3f6}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--b);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:4px solid var(--c);position:sticky;top:0;z-index:5}
header img{width:38px;height:38px;border-radius:50%;background:#fff}header b{flex:1;font-size:15px;line-height:1.2}
header button{background:none;border:1px solid #fff8;color:#fff;border-radius:6px;padding:4px 9px}
main{padding:12px;padding-bottom:84px;max-width:640px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:13px 0;color:var(--mut);font-weight:600;border-top:3px solid transparent}
nav button.on{color:var(--b);border-top-color:var(--c)}
.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.mut{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:9px;border-radius:20px;border:1px solid var(--b);background:#fff;color:var(--b);font-weight:600}.tabs .on{background:var(--b);color:#fff}
.btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:600;font-size:15px}.btn.s{background:#fff;color:var(--b);border:1px solid var(--b)}.btn.d{background:#c62828}.btn:disabled{opacity:.5}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;font:inherit;margin:4px 0 10px}
label{font-weight:600;font-size:13px}.tag{background:#e3f6fd;color:#0a6e96;border-radius:5px;padding:1px 7px;font-size:12px}.warn{background:#fff3d6;color:#8a5a00}
#m{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}#m>div{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;max-width:640px;margin:auto}
table{width:100%;border-collapse:collapse}td,th{padding:6px 2px;border-bottom:1px solid var(--ln);text-align:left}td:last-child,th:last-child{text-align:right}
#login{max-width:340px;margin:12vh auto;text-align:center;padding:16px}#login img{width:120px;border-radius:50%}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:20}
</style></head><body>
<div id="login"><img src="icon-192.png" alt=""><h2 id="lt"></h2><input id="pw" type="password" autocomplete="current-password"><button class="btn" id="lb" style="width:100%"></button><p id="le" style="color:#c62828"></p></div>
<div id="app" hidden>
<header><img src="icon-192.png" alt=""><b id="co"></b><button id="lg">हिं</button><button id="lo">⎋</button></header>
<main id="v"></main>
<nav><button data-t="orders"></button><button data-t="retailers"></button><button data-t="products"></button></nav></div>
<div id="m"><div id="mc"></div></div><div id="toast"></div>
<script>
const API='https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev'; // <- put your Worker URL here
const L={en:{co:'Sanchi – Ujjain Sahakari Dugdh Sangh Maryadit',pw:'Admin password',login:'Log in',orders:'Orders',retailers:'Retailers',products:'Products',pending:'Pending',delivered:'Delivered',unk:'Unknown retailer',assign:'Assign retailer',pick:'Select retailer',deliver:'Mark delivered & send WhatsApp',conf:'Mark this order delivered and message the retailer?',done:'Delivered and message sent',items:'Items',amt:'Amount',total:'Total',add:'Add retailer',edit:'Edit',del:'Delete',delq:'Delete this retailer?',name:'Name',addr:'Address',phones:'WhatsApp numbers (one per line, with country code)',save:'Save',close:'Close',sync:'Sync rates now',synced:'Products synced: ',noord:'No orders yet.',noret:'No retailers yet. Add one to match incoming orders.',nopro:'No products yet. Tap Sync rates now.',rate:'Rate',upd:'Updated',saved:'Saved',qty:'Qty'},
hi:{co:'सांची – उज्जैन सहकारी दुग्ध संघ मर्यादित',pw:'एडमिन पासवर्ड',login:'लॉगिन',orders:'ऑर्डर',retailers:'रिटेलर',products:'उत्पाद',pending:'लंबित',delivered:'डिलीवर हुए',unk:'अज्ञात रिटेलर',assign:'रिटेलर चुनें',pick:'रिटेलर चुनें',deliver:'डिलीवर करें और WhatsApp भेजें',conf:'ऑर्डर डिलीवर मार्क करें और रिटेलर को संदेश भेजें?',done:'डिलीवर हुआ, संदेश भेजा गया',items:'आइटम',amt:'राशि',total:'कुल',add:'रिटेलर जोड़ें',edit:'बदलें',del:'हटाएं',delq:'यह रिटेलर हटाएं?',name:'नाम',addr:'पता',phones:'WhatsApp नंबर (हर लाइन में एक, देश कोड सहित)',save:'सेव करें',close:'बंद करें',sync:'रेट अभी सिंक करें',synced:'उत्पाद सिंक हुए: ',noord:'अभी कोई ऑर्डर नहीं।',noret:'कोई रिटेलर नहीं। ऑर्डर मिलाने के लिए जोड़ें।',nopro:'कोई उत्पाद नहीं। रेट सिंक करें दबाएं।',rate:'रेट',upd:'अपडेट',saved:'सेव हुआ',qty:'मात्रा'}};
let lang=localStorage.lang||'en',tok=localStorage.tok,tab='orders',st='pending';
const t=k=>L[lang][k]||k,$=s=>document.querySelector(s),money=x=>'₹'+Number(x||0).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=s=>s?new Date(s.replace(' ','T')+'Z').toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'';
function toast(x){const e=$('#toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}
async function api(p,m='GET',b){const r=await fetch(API+'/api'+p,{method:m,headers:{authorization:'Bearer '+tok,'content-type':'application/json'},body:b?JSON.stringify(b):undefined});
 if(r.status===401&&p!=='/login'){out();throw new Error('Session expired')}const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');return d}
const out=()=>{localStorage.removeItem('tok');tok=null;show()};
const modal=h=>{$('#mc').innerHTML=h;$('#m').style.display='flex'},closeM=()=>$('#m').style.display='none';
$('#m').onclick=e=>{if(e.target.id==='m')closeM()};
function show(){const on=!!tok;$('#login').hidden=on;$('#app').hidden=!on;document.documentElement.lang=lang;
 $('#lt').textContent=t('co');$('#pw').placeholder=t('pw');$('#lb').textContent=t('login');$('#co').textContent=t('co');$('#lg').textContent=lang==='en'?'हिं':'EN';
 document.querySelectorAll('nav button').forEach(b=>{b.textContent=t(b.dataset.t);b.classList.toggle('on',b.dataset.t===tab)});if(on)render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;show()});
$('#lg').onclick=()=>{lang=lang==='en'?'hi':'en';localStorage.lang=lang;show()};$('#lo').onclick=out;
$('#lb').onclick=async()=>{try{tok=(await api('/login','POST',{password:$('#pw').value})).token;localStorage.tok=tok;$('#le').textContent='';show()}catch(e){$('#le').textContent=e.message}};
async function render(){const v=$('#v');try{await({orders,retailers,products})[tab](v)}catch(e){v.innerHTML='<p>'+esc(e.message)+'</p>'}}
async function orders(v){
 v.innerHTML=`<div class="tabs"><button class="${st==='pending'?'on':''}" data-s="pending">${t('pending')}</button><button class="${st==='delivered'?'on':''}" data-s="delivered">${t('delivered')}</button></div><div id="ol"></div>`;
 v.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{st=b.dataset.s;render()});
 const r=await api('/orders?status='+st);
 $('#ol').innerHTML=r.length?r.map(o=>`<div class="card" data-id="${o.id}"><div class="row"><b>#${o.id} ${o.rn?esc(o.rn):`<span class="tag warn">${t('unk')}</span>`}</b><b>${money(o.a)}</b></div><div class="row mut"><span>${dt(o.delivered_at||o.created_at)}</span><span>${t('items')}: ${o.q||0}</span></div></div>`).join(''):`<p class="mut">${t('noord')}</p>`;
 document.querySelectorAll('.card[data-id]').forEach(c=>c.onclick=()=>detail(r.find(o=>o.id==c.dataset.id)))}
async function detail(o){
 const it=await api('/orders/'+o.id),rt=o.retailer_id?[]:await api('/retailers');
 modal(`<h3>#${o.id} ${o.rn?esc(o.rn):t('unk')}</h3><p class="mut">+${esc(o.phone)} · ${dt(o.created_at)}</p>
 <table><tr><th>${t('items')}</th><th>${t('qty')}</th><th>${t('rate')}</th><th>${t('amt')}</th></tr>${it.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.rate)}</td><td>${money(i.qty*i.rate)}</td></tr>`).join('')}
 <tr><th>${t('total')}</th><th>${o.q||0}</th><th></th><th>${money(o.a)}</th></tr></table><br>
 ${!o.retailer_id?`<label>${t('assign')}</label><select id="as"><option value="">${t('pick')}</option>${rt.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button class="btn s" id="asb" style="width:100%">${t('save')}</button><br><br>`:''}
 ${o.status==='pending'&&o.retailer_id?`<button class="btn" id="dv" style="width:100%">${t('deliver')}</button><br><br>`:''}
 <button class="btn s" style="width:100%" onclick="closeM()">${t('close')}</button>`);
 const a=$('#asb');if(a)a.onclick=async()=>{if(!$('#as').value)return;await api(`/orders/${o.id}/assign`,'POST',{retailer_id:$('#as').value});closeM();toast(t('saved'));render()};
 const d=$('#dv');if(d)d.onclick=async()=>{if(!confirm(t('conf')))return;d.disabled=true;try{await api(`/orders/${o.id}/deliver`,'POST');closeM();toast(t('done'));render()}catch(e){d.disabled=false;toast(e.message)}}}
async function retailers(v){
 const r=await api('/retailers');
 v.innerHTML=`<button class="btn" id="ad" style="width:100%;margin-bottom:12px">+ ${t('add')}</button>`+(r.length?r.map(x=>`<div class="card" data-r="${x.id}"><b>${esc(x.name)}</b><div class="mut">${esc(x.address)}</div><div class="mut">${(x.phones||'').split(',').filter(Boolean).map(p=>'+'+esc(p)).join(' · ')}</div></div>`).join(''):`<p class="mut">${t('noret')}</p>`);
 $('#ad').onclick=()=>form();document.querySelectorAll('[data-r]').forEach(c=>c.onclick=()=>form(r.find(x=>x.id==c.dataset.r)))}
function form(x={}){
 modal(`<label>${t('name')}</label><input id="fn" value="${esc(x.name)}"><label>${t('addr')}</label><input id="fa" value="${esc(x.address)}"><label>${t('phones')}</label><textarea id="fp" rows="4">${esc((x.phones||'').split(',').filter(Boolean).join('\n'))}</textarea>
 <button class="btn" id="fs" style="width:100%">${t('save')}</button>${x.id?`<br><br><button class="btn d" id="fd" style="width:100%">${t('del')}</button>`:''}<br><br><button class="btn s" style="width:100%" onclick="closeM()">${t('close')}</button>`);
 $('#fs').onclick=async()=>{const b={name:$('#fn').value.trim(),address:$('#fa').value.trim(),phones:$('#fp').value.split('\n').map(s=>s.trim()).filter(Boolean)};if(!b.name)return;
  try{await api(x.id?'/retailers/'+x.id:'/retailers',x.id?'PUT':'POST',b);closeM();toast(t('saved'));render()}catch(e){toast(e.message)}};
 const d=$('#fd');if(d)d.onclick=async()=>{if(confirm(t('delq'))){await api('/retailers/'+x.id,'DELETE');closeM();render()}}}
async function products(v){
 const p=await api('/products');
 v.innerHTML=`<button class="btn" id="sy" style="width:100%;margin-bottom:12px">${t('sync')}</button>`+(p.length?p.map(x=>`<div class="card row"><div><b>${esc(x.name)}</b><div class="mut">${esc(x.id)} · ${t('upd')}: ${esc(x.updated_at)}</div></div><b>${money(x.rate)}</b></div>`).join(''):`<p class="mut">${t('nopro')}</p>`);
 $('#sy').onclick=async e=>{e.target.disabled=true;try{const r=await api('/sync','POST');toast(t('synced')+r.synced);render()}catch(err){toast(err.message);e.target.disabled=false}}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
show();
</script></body></html>
